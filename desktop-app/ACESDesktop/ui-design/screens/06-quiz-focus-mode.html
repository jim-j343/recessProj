<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACES — Quiz Focus Mode</title>
<link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
<link rel="stylesheet" href="../css/aces-design-system.css">
</head>
<body style="background:#e2e8f0;">
<!-- Focus / takeover mode: chrome stripped, proctoring active -->
<div style="min-height:100vh;display:flex;flex-direction:column;">
  <div style="position:absolute;top:20px;right:32px;display:flex;align-items:center;gap:8px;color:var(--danger);font-weight:700;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    <div style="text-align:right;"><div style="font-size:22px;line-height:1;">24:57</div><div style="font-size:10px;letter-spacing:.08em;">TIME REMAINING</div></div>
  </div>

  <div style="flex:1;display:grid;place-items:center;padding:40px;">
    <div class="card" style="width:100%;max-width:640px;padding:32px;">
      <div class="row between" style="margin-bottom:20px;">
        <div><div class="h-sm">Advanced Web Systems</div><div class="muted" style="font-size:12px;">Question 12 of 30 · Multiple Choice</div></div>
        <span class="badge badge-neutral">🔒 LOCKED</span>
      </div>

      <div class="h-md" style="margin-bottom:24px;">What is the primary benefit of using a Virtual DOM in modern web frameworks?</div>

      <div class="col" style="gap:12px;">
        <label class="row" style="gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;"><input type="radio" name="q"> Faster initial render</label>
        <label class="row" style="gap:12px;padding:14px 16px;border:2px solid var(--ink);border-radius:var(--r-md);cursor:pointer;background:var(--surface-2);"><input type="radio" name="q" checked> Efficient updates by minimizing direct DOM manipulation</label>
        <label class="row" style="gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;"><input type="radio" name="q"> Automatic SEO optimization</label>
        <label class="row" style="gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;"><input type="radio" name="q"> Native browser support</label>
      </div>

      <hr class="divider">
      <div class="row between">
        <button class="btn btn-ghost btn-sm">🚩 Review Later</button>
        <div class="row" style="gap:8px;">
          <button class="btn btn-secondary btn-sm">Previous</button>
          <button class="btn btn-primary btn-sm">Next Question →</button>
        </div>
      </div>
    </div>
  </div>

  <div style="text-align:center;padding:16px;color:var(--muted);font-size:12px;">
    🛡 Proctoring Active · Screen Recording &amp; Tab Locking Enabled
  </div>
</div>
</body>
</html>
