<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACES — Create Account</title>
<link rel="stylesheet" href="../css/aces-design-system.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand" style="margin-bottom:24px;">
      <div class="logo" style="width:48px;height:48px;font-size:20px;">A</div>
      <div>
        <div class="display" style="font-size:30px;">Create Account</div>
        <div class="muted">Join the ACES platform to get started</div>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label>Select Role</label>
        <div class="segmented" style="display:flex;width:100%;">
          <button style="flex:1;">Student</button>
          <button class="active" style="flex:1;">Lecturer</button>
          <button style="flex:1;">Admin</button>
        </div>
      </div>

      <div class="field">
        <label>Full Name</label>
        <div class="input-group">
          <span class="lead"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <input class="input" placeholder="Enter your full name">
        </div>
      </div>

      <div class="field">
        <label>Email Address</label>
        <div class="input-group">
          <span class="lead"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg></span>
          <input class="input" type="email" placeholder="your.email@example.com">
        </div>
      </div>

      <div class="grid grid-2" style="gap:16px;">
        <div class="field">
          <label>Password</label>
          <input class="input" type="password" placeholder="••••••••">
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input class="input" type="password" placeholder="••••••••">
        </div>
      </div>

      <label class="row" style="gap:8px;color:var(--ink-2);font-size:13px;margin:4px 0 20px;cursor:pointer;">
        <input type="checkbox"> I agree to the <a href="#">Platform Rules</a> and <a href="#">Terms of Service</a>
      </label>

      <button class="btn btn-primary btn-block">Register
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>

      <p style="text-align:center;margin:20px 0 0;color:var(--ink-2);">Already have an account? <a href="01-login.html" style="font-weight:700;color:var(--ink);">Sign In</a></p>
    </div>
  </div>
</div>
</body>
</html>
