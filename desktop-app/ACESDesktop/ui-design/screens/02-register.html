<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACES — Create Account</title>
<link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
<link rel="stylesheet" href="../css/aces-design-system.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand" style="margin-bottom:24px;">
      <span class="brand-mark" style="width:52px;height:52px;"></span>
      <div>
        <div class="display" style="font-size:30px;">Create Account</div>
        <div class="muted">Join the ACES platform to get started</div>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label>Select Role</label>
        <div class="segmented" style="display:flex;width:100%;">
          <button style="flex:1;">Student</button>
          <button class="active" style="flex:1;">Lecturer</button>
          <button style="flex:1;">Admin</button>
        </div>
      </div>

      <div class="field">
        <label>Full Name</label>
        <div class="input-group">
          <span class="lead"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <input class="input" placeholder="Enter your full name">
        </div>
      </div>

      <div class="field">
        <label>Email Address</label>
        <div class="input-group">
          <span class="lead"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg></span>
          <input class="input" type="email" placeholder="your.email@example.com">
        </div>
      </div>

      <div class="grid grid-2" style="gap:16px;">
        <div class="field">
          <label>Password</label>
          <div class="input-group">
            <span class="lead"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input class="input" type="password" placeholder="••••••••" style="padding-right:40px;">
            <span class="trail" onclick="togglePw(this)" role="button" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg></span>
          </div>
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <div class="input-group">
            <span class="lead"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input class="input" type="password" placeholder="••••••••" style="padding-right:40px;">
            <span class="trail" onclick="togglePw(this)" role="button" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg></span>
          </div>
        </div>
      </div>

      <label class="row" style="gap:8px;color:var(--ink-2);font-size:13px;margin:4px 0 20px;cursor:pointer;">
        <input type="checkbox"> I agree to the <a href="#">Platform Rules</a> and <a href="#">Terms of Service</a>
      </label>

      <button class="btn btn-primary btn-block">Register
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>

      <p style="text-align:center;margin:20px 0 0;color:var(--ink-2);">Already have an account? <a href="01-login.html" style="font-weight:700;color:var(--ink);">Sign In</a></p>
    </div>
  </div>
</div>

<script>
  var EYE_OPEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
  window.togglePw = function (btn) {
    var inp = btn.parentElement.querySelector('input');
    var reveal = inp.type === 'password';
    inp.type = reveal ? 'text' : 'password';
    btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
    btn.innerHTML = reveal ? EYE_OPEN : EYE_OFF;
  };
</script>
</body>
</html>
