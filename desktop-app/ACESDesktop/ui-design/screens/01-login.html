<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACES — Sign In</title>
<link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
<link rel="stylesheet" href="../css/aces-design-system.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand" style="margin-bottom:24px;">
      <span class="brand-mark" style="width:52px;height:52px;"></span>
      <div>
        <div class="display" style="font-size:30px;">ACES</div>
      </div>
    </div>

    <div class="card">
      <div class="segmented" style="display:flex;width:100%;margin-bottom:20px;">
        <button style="flex:1;">Student</button>
        <button class="active" style="flex:1;">Lecturer</button>
        <button style="flex:1;">Admin</button>
      </div>

      <div class="field">
        <label>Email Address</label>
        <div class="input-group">
          <span class="lead">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
          </span>
          <input class="input" type="email" placeholder="your.email@example.com">
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-group">
          <span class="lead">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input class="input" type="password" value="password123" style="padding-right:38px;">
          <span class="trail" onclick="togglePw(this)" role="button" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
          </span>
        </div>
      </div>

      <div class="row between" style="margin:4px 0 20px;">
        <label class="row" style="gap:8px;color:var(--ink-2);font-size:13px;cursor:pointer;"><input type="checkbox"> Remember me</label>
        <a href="#" style="font-weight:600;">Forgot Password?</a>
      </div>

      <button class="btn btn-primary btn-block">Sign In
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>

      <p style="text-align:center;margin:20px 0 0;color:var(--ink-2);">Don't have an account? <a href="02-register.html" style="font-weight:700;color:var(--ink);">Sign Up</a></p>
    </div>

    <p style="text-align:center;color:var(--muted);margin-top:20px;font-size:13px;">Need help accessing your account? <a href="#" style="font-weight:600;">Contact Administrator</a></p>
  </div>
</div>

<script>
  window.togglePw = function (btn) {
    var inp = btn.parentElement.querySelector('input');
    var reveal = inp.type === 'password';
    inp.type = reveal ? 'text' : 'password';
    btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
    btn.innerHTML = reveal ? EYE_OPEN : EYE_OFF;
  };
  var EYE_OPEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
</script>
</body>
</html>
